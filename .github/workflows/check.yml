name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out committed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix fmt -- --check .

      - name: Run Statix
        run: nix develop --command statix check --ignore hosts/sleepy-vm/hardware-configuration.nix .

      - name: Run deadnix
        run: nix develop --command deadnix --fail --exclude hosts/sleepy-vm/hardware-configuration.nix .

      - name: Run ShellCheck
        shell: bash
        run: |
          mapfile -d '' scripts < <(git ls-files -z '*.sh')
          if ((${#scripts[@]})); then
            nix develop --command shellcheck "${scripts[@]}"
          fi

      - name: Run source contract fixtures
        run: |
          nix develop --command bash checks/source-clean-test.sh
          nix develop --command bash checks/baseline-provenance-test.sh
          nix develop --command bash checks/quickshell-contract-test.sh
          nix develop --command bash checks/component-contract-test.sh
          nix develop --command bash checks/component-lock-test.sh
          nix develop --command bash checks/flake-shape-test.sh
          nix develop --command bash checks/flake-input-contract-test.sh
          nix develop --command bash checks/license-contract-test.sh
          nix develop --command bash checks/update-safety-contract-test.sh
          nix develop --command bash checks/root-integration-contract-test.sh
          nix develop --command bash checks/desktop-m3-root-contract-test.sh
          nix develop --command bash checks/locker-lifecycle-test.sh
          nix develop --command bash checks/hyprland-session-contract-test.sh
          nix develop --command bash checks/hyprland-user-config-test.sh
          nix develop --command bash checks/vm-acceptance-assets-test.sh

      - name: Test Snug and installer behavior
        run: |
          nix develop --command python3 checks/snug-test.py
          nix develop --command python3 checks/snug-system-test.py
          nix develop --command python3 checks/snug-desktop-test.py
          nix develop --command python3 checks/installer-test.py
          nix develop --command python3 checks/shell-defaults-test.py
          bash checks/snug-real.sh

      - name: Validate locked component revisions
        run: bash checks/component-lock.sh components/desktop-m1.json components/desktop-m2-baseline.json flake.lock

      - name: Evaluate all checks
        run: nix flake check --all-systems --no-build --show-trace

  build:
    name: Build checks and configurations
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out committed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Enable KVM for the update VM checks
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Prove fresh-clone reproducibility
        run: bash checks/fresh-clone.sh

      - name: Build all checks
        run: nix flake check -L

      - name: Build packaged desktop production smoke
        run: nix build .#checks.x86_64-linux.sleepy-desktop-qml --no-link -L

      - name: Validate Hyprland and UWSM session contracts
        run: |
          nix build .#checks.x86_64-linux.hyprland-config --no-link -L
          nix build .#checks.x86_64-linux.session-contract --no-link -L

      - name: Run the isolated Hyprland production VM gate
        run: nix build .#checks.x86_64-linux.hyprland-production-vm --no-link -L

      - name: Build Sleepy NixOS
        run: nix build .#nixosConfigurations.sleepy-vm.config.system.build.toplevel --no-link -L

      - name: Build standalone Home Manager
        run: nix build '.#homeConfigurations."lazy@sleepy-vm".activationPackage' --no-link -L

      - name: Build minimal Sleepy installer ISO
        run: nix build .#iso --no-link -L

      - name: Assert clean checkout
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
